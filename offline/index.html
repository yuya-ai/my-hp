<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>いなりとチキン ビオ｜準備中</title>
<style>
  :root{ --cream:#faf5e4; --orange:#FF6B2B; --yellow:#FFD900; --dark:#231815; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ min-height:100vh; }
  body{
    background:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Klee One',sans-serif;
    color:var(--dark);
    display:flex; align-items:center; justify-content:center;
    padding:24px; min-height:100vh; line-height:1.7;
  }
  .card{
    width:100%; max-width:460px; background:#fff;
    border-radius:24px; padding:40px 28px; text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.10);
    border:1px solid rgba(0,0,0,.05);
  }
  .logo{ font-size:1.9rem; font-weight:800; letter-spacing:.02em; margin-bottom:4px; }
  .sub{ font-size:.9rem; color:#8a8072; margin-bottom:26px; }
  .icon{ font-size:56px; line-height:1; margin-bottom:14px; }
  .title{ font-size:1.25rem; font-weight:800; margin-bottom:12px; }
  .lead{ font-size:1rem; color:#5a5248; margin-bottom:28px; }
  .tel-label{ font-size:.85rem; color:#8a8072; margin-bottom:6px; }
  .tel{
    display:inline-block; background:var(--orange); color:#fff;
    font-size:1.5rem; font-weight:800; text-decoration:none;
    padding:16px 34px; border-radius:999px; letter-spacing:.03em;
    box-shadow:0 6px 18px rgba(255,107,43,.35);
  }
  .hours{ font-size:.85rem; color:#8a8072; margin-top:22px; }
  .addr{ font-size:.8rem; color:#a89f8f; margin-top:10px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">いなりとチキン ビオ</div>
    <div class="sub">沖縄・南城市 / テイクアウト専門</div>

    <div class="icon">🐣</div>
    <div class="title">ホームページは ただいま準備中です</div>
    <p class="lead">ご来店・ご利用ありがとうございます🙏<br>ご注文・お問い合わせはお電話にて<br>承っております🌸</p>

    <div class="tel-label">📞 お電話でのご注文はこちら</div>
    <a class="tel" href="tel:098-944-4191">098-944-4191</a>

    <div class="hours">営業時間 9:00〜17:00 ／ 売り切れ次第終了</div>
    <div class="hours">定休日 月曜日 ＋ 第4水曜日</div>
    <div class="addr">〒901-1206 沖縄県南城市大里字仲間1141（JAアトールむかい）</div>
  </div>
</body>
</html>
