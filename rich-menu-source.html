<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Bio Rich Menu — Top Hero + Bottom Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=RocknRoll+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow:   #FFD900;
    --yellow-2: #FFE94A;
    --orange:   #FF6B2B;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:2500px; height:1686px; overflow:hidden; }
  body {
    font-family:'Klee One', sans-serif;
    display:flex;
    flex-direction:column;
    background-image: url('bio/menu-inari-chicken.jpg');
    background-size: 2500px 1686px;
    background-position: 0 0;
    background-repeat: no-repeat;
    background-color:#000;
  }

  /* ===== A: 上大 (2500×843) ===== */
  .a {
    width:2500px; height:843px;
    position:relative;
    overflow:hidden;
    border-bottom: 6px solid #fff;
    color:#fff;
    text-align:center;
  }
  .a-overlay {
    position:absolute; inset:0;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.45) 0%,
      rgba(0,0,0,0.18) 30%,
      rgba(0,0,0,0.18) 50%,
      rgba(0,0,0,0.55) 100%);
    z-index:1;
  }
  .a-inner {
    position:absolute; inset:0;
    z-index:3;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding: 0 80px;
  }
  .a-brand {
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:50px;
    color:#fff;
    letter-spacing:.16em;
    text-shadow: 0 4px 18px rgba(0,0,0,0.9);
    margin-bottom:20px;
  }
  .a-brand .sep { color: var(--yellow); margin: 0 .4em; font-weight:500; }
  .a-tap {
    font-family:'RocknRoll One', 'Zen Maru Gothic', sans-serif;
    font-weight:400;
    font-size:250px;
    line-height:1;
    color:#fff;
    letter-spacing:.05em;
    text-shadow:
      0 0 40px rgba(0,0,0,0.95),
      0 12px 32px rgba(0,0,0,0.92),
      6px 6px 0 rgba(0,0,0,0.55);
  }
  .a-cta-row {
    display:flex;
    align-items:center;
    gap:48px;
    margin-top:34px;
  }
  .a-sub {
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:54px;
    color: var(--yellow);
    letter-spacing:.08em;
    text-shadow: 0 4px 14px rgba(0,0,0,0.9);
  }
  .a-cta-btn {
    display:inline-flex;
    align-items:center;
    gap:20px;
    background: var(--yellow);
    color:#1a1a1a;
    font-family:'RocknRoll One', 'Zen Maru Gothic', sans-serif;
    font-weight:400;
    font-size:62px;
    padding: 22px 72px;
    border-radius:120px;
    box-shadow:
      0 8px 0 rgba(180,140,0,0.55),
      0 18px 36px rgba(0,0,0,0.5);
    letter-spacing:.08em;
  }
  .a-cta-btn .arrow {
    color: var(--orange);
    font-size:48px;
  }

  /* ===== 下段：2列 ===== */
  .bottom { display:flex; height:843px; }

  /* ===== B: 下左 (1250×843) — 予約確認 ===== */
  .b {
    width:1250px; height:843px;
    position:relative;
    overflow:hidden;
    border-right: 6px solid #fff;
    color:#fff;
    text-align:center;
  }
  .b-overlay {
    position:absolute; inset:0;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.60) 0%,
      rgba(0,0,0,0.42) 40%,
      rgba(0,0,0,0.65) 100%);
    z-index:1;
  }
  .b-inner {
    position:absolute; inset:0;
    z-index:3;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px;
  }
  .b-icon {
    font-size:170px;
    line-height:1;
    margin-bottom:14px;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.75));
  }
  .b-title {
    font-family:'RocknRoll One', 'Zen Maru Gothic', sans-serif;
    font-weight:400;
    font-size:170px;
    color:#fff;
    letter-spacing:.08em;
    line-height:1;
    text-shadow:
      0 0 36px rgba(0,0,0,0.95),
      0 10px 24px rgba(0,0,0,0.92),
      5px 5px 0 rgba(0,0,0,0.55);
  }
  .b-underline {
    width:360px;
    height:6px;
    background: var(--yellow);
    margin: 30px auto 22px;
    border-radius:3px;
    box-shadow: 0 2px 12px rgba(255,217,0,0.55);
  }
  .b-sub {
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:48px;
    color: var(--yellow);
    letter-spacing:.08em;
    text-shadow: 0 4px 12px rgba(0,0,0,0.9);
  }
  .b-sub .chick { font-size:56px; vertical-align:middle; margin: 0 8px; }

  /* ===== C: 下右 (1250×843) — お電話 ===== */
  .c {
    width:1250px; height:843px;
    position:relative;
    overflow:hidden;
    color:#fff;
    text-align:center;
  }
  .c-overlay {
    position:absolute; inset:0;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.62) 0%,
      rgba(0,0,0,0.45) 40%,
      rgba(0,0,0,0.72) 100%);
    z-index:1;
  }
  .c-inner {
    position:absolute; inset:0;
    z-index:3;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px;
  }
  .c-icon {
    font-size:150px;
    line-height:1;
    margin-bottom:10px;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.75));
  }
  .c-title {
    font-family:'RocknRoll One', 'Zen Maru Gothic', sans-serif;
    font-weight:400;
    font-size:140px;
    color:#fff;
    letter-spacing:.08em;
    line-height:1;
    text-shadow:
      0 0 36px rgba(0,0,0,0.95),
      0 10px 24px rgba(0,0,0,0.92),
      5px 5px 0 rgba(0,0,0,0.55);
  }
  .c-underline {
    width:340px;
    height:6px;
    background: var(--yellow);
    margin: 22px auto 16px;
    border-radius:3px;
    box-shadow: 0 2px 12px rgba(255,217,0,0.55);
  }
  .c-num {
    font-family:'RocknRoll One', 'Zen Maru Gothic', sans-serif;
    font-weight:400;
    font-size:114px;
    color: var(--yellow);
    letter-spacing:.03em;
    line-height:1;
    text-shadow: 0 6px 18px rgba(0,0,0,0.95);
    white-space:nowrap;
  }
  .c-num .chick {
    font-size:74px;
    vertical-align:middle;
    margin: 0 14px;
  }
  .c-sub {
    margin-top:18px;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:42px;
    color:#fff;
    letter-spacing:.08em;
    text-shadow: 0 4px 12px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>

  <!-- A: 上大 -->
  <section class="a">
    <div class="a-overlay"></div>
    <div class="a-inner">
      <div class="a-brand">いなりとチキン ビオ<span class="sep">／</span>沖縄 南城市</div>
      <div class="a-tap">タップして予約</div>
      <div class="a-cta-row">
        <div class="a-sub">24時間 LINE 予約可能 ✨</div>
        <div class="a-cta-btn"><span class="arrow">▶</span> ここをタップ</div>
      </div>
    </div>
  </section>

  <!-- 下段 -->
  <div class="bottom">
    <!-- B: 下左 -->
    <section class="b">
      <div class="b-overlay"></div>
      <div class="b-inner">
        <div class="b-icon">📅</div>
        <div class="b-title">予約確認</div>
        <div class="b-underline"></div>
        <div class="b-sub"><span class="chick">🐣</span> マイ予約をチェック <span class="chick">🐣</span></div>
      </div>
    </section>

    <!-- C: 下右 -->
    <section class="c">
      <div class="c-overlay"></div>
      <div class="c-inner">
        <div class="c-icon">📞</div>
        <div class="c-title">お電話</div>
        <div class="c-underline"></div>
        <div class="c-num"><span class="chick">🐣</span> 098-944-4191 <span class="chick">🐣</span></div>
        <div class="c-sub">9:00〜17:00 ／ 月曜定休</div>
      </div>
    </section>
  </div>

</body>
</html>
