<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>ビオ 予約完了通知</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --cream: #faf5e4;
    --orange: #FF6B2B;
    --dark: #231815;
    --green: #2e7d32;
    --red: #c62828;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Klee One', sans-serif;
    color: var(--dark);
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .icon {
    font-size: 64px;
    margin-bottom: 16px;
    line-height: 1;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,107,43,.2);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 16px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status {
    font-size: 17px;
    line-height: 1.7;
    margin: 12px 0 6px;
    font-weight: 600;
  }
  .sub {
    font-size: 14px;
    color: rgba(35,24,21,.65);
    line-height: 1.6;
  }
  .ok .status { color: var(--green); }
  .err .status { color: var(--red); }
  .retry {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 28px;
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="icon" id="icon">🌸</div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">予約完了通知を準備中…</div>
  <div class="sub" id="sub">少々お待ちください🐣💕</div>
</div>

<script>
(function(){
  // ★ LIFF ID は LINE Developers Console > LIFFタブ で発行された値に差し替え
  var LIFF_ID = '2010011597-uYpz77cg';
  var PUSH_ENDPOINT = '/api/send-reserve-push';

  var wrap = document.getElementById('wrap');
  var icon = document.getElementById('icon');
  var spinner = document.getElementById('spinner');
  var statusEl = document.getElementById('status');
  var subEl = document.getElementById('sub');

  function setSuccess(text) {
    wrap.classList.remove('err');
    wrap.classList.add('ok');
    spinner.style.display = 'none';
    icon.textContent = '✨';
    statusEl.textContent = text;
    subEl.innerHTML = 'LINEのトーク画面でご確認ください💕<br><br><a href="https://line.me/R/ti/p/@708zxzjm" class="retry">LINEを開く →</a>';
  }

  function setError(text, sub) {
    wrap.classList.remove('ok');
    wrap.classList.add('err');
    spinner.style.display = 'none';
    icon.textContent = '🙏';
    statusEl.textContent = text;
    subEl.textContent = sub || 'お手数ですがもう一度お試しください';
  }

  function getPayloadParam() {
    var direct = new URLSearchParams(window.location.search).get('p');
    if (direct) return direct;
    var state = new URLSearchParams(window.location.search).get('liff.state');
    if (state) {
      var sp = new URLSearchParams(state.charAt(0) === '?' ? state.slice(1) : state);
      return sp.get('p');
    }
    return null;
  }

  async function fallbackSendMessage(payloadB64) {
    if (!liff.isInClient()) return false;
    try {
      await liff.sendMessages([{
        type: 'text',
        text: '🌸 ビオへの予約完了通知\n\n⬇️ ビオくんから詳細メッセージが届きます🐣✨\n\n─ 予約データ ─\nBIO_RSV:' + payloadB64
      }]);
      return true;
    } catch (e) {
      console.error('liff.sendMessages failed:', e);
      return false;
    }
  }

  async function main(payloadB64) {
    try {
      await liff.init({ liffId: LIFF_ID });
    } catch (e) {
      console.error('liff.init failed:', e);
      setError('LINE連携に失敗しました', 'ページを開き直してください');
      return;
    }

    if (!liff.isLoggedIn()) {
      liff.login({ redirectUri: window.location.href });
      return;
    }

    var userId = null;
    try {
      var profile = await liff.getProfile();
      userId = profile.userId;
    } catch (e) {
      console.error('liff.getProfile failed:', e);
    }

    if (userId) {
      try {
        var res = await fetch(PUSH_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: userId, payload: payloadB64 })
        });
        if (res.ok) {
          setSuccess('予約完了通知をお届けしました🌸');
          if (liff.isInClient()) {
            setTimeout(function(){ liff.closeWindow(); }, 1800);
          } else {
            setTimeout(function(){ window.location.href = 'https://line.me/R/ti/p/@708zxzjm'; }, 1500);
          }
          return;
        }
        console.error('push HTTP', res.status, await res.text());
      } catch (e) {
        console.error('push fetch failed:', e);
      }
    }

    var sent = await fallbackSendMessage(payloadB64);
    if (sent) {
      setSuccess('予約完了通知をお届けしました🌸');
      if (liff.isInClient()) {
        setTimeout(function(){ liff.closeWindow(); }, 1800);
      } else {
        setTimeout(function(){ window.location.href = 'https://line.me/R/ti/p/@708zxzjm'; }, 1500);
      }
      return;
    }

    setError('通知の送信に失敗しました', 'LINEのトーク画面で「予約」と送信してください🙏');
  }

  var payloadB64 = getPayloadParam();
  if (!payloadB64) {
    setError('予約データが見つかりません', '予約フォームからやり直してください🙏');
    return;
  }
  if (LIFF_ID === '__LIFF_ID__') {
    setError('LIFF IDが未設定です', 'システム管理者にご連絡ください🙏');
    return;
  }
  main(payloadB64);
})();
</script>
</body>
</html>
