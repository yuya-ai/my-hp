<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ビオ予約LP QRコード</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: linear-gradient(135deg, #faf5e4 0%, #fff8e0 50%, #ffe9b8 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Klee One', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .container {
    background: white;
    border-radius: 32px;
    padding: 40px 28px;
    box-shadow: 0 20px 60px rgba(255,107,43,0.15);
    text-align: center;
    width: 100%;
    max-width: 480px;
  }
  .header-emoji {
    font-size: 44px;
    margin-bottom: 4px;
    line-height: 1;
  }
  h1 {
    color: #FF6B2B;
    font-size: 32px;
    margin: 4px 0 4px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  .store-name {
    color: #333;
    font-size: 17px;
    font-weight: 700;
    margin-top: 4px;
  }
  .subtitle {
    color: #666;
    font-size: 15px;
    margin: 16px 0 24px;
    font-weight: 500;
  }
  .qr-wrapper {
    background: white;
    padding: 16px;
    border-radius: 20px;
    border: 6px solid #FF6B2B;
    display: inline-block;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(255,107,43,0.2);
  }
  .qr-wrapper img {
    display: block;
    width: 280px;
    height: 280px;
    max-width: 100%;
  }
  .url-pill {
    background: linear-gradient(135deg, #FF6B2B, #ff8552);
    color: white;
    padding: 12px 24px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 700;
    display: inline-block;
    margin: 12px 0;
    box-shadow: 0 6px 18px rgba(255,107,43,0.35);
    letter-spacing: 0.02em;
    word-break: break-all;
  }
  .lp-direct-btn {
    display: inline-block;
    background: #FF6B2B;
    color: white;
    text-decoration: none;
    padding: 14px 36px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 700;
    margin-top: 16px;
    box-shadow: 0 8px 22px rgba(255,107,43,0.32);
  }
  .instructions {
    background: #fef9ea;
    border-radius: 16px;
    padding: 18px 22px;
    margin-top: 22px;
    text-align: left;
  }
  .instructions-title {
    text-align: center;
    color: #FF6B2B;
    font-weight: 700;
    margin-bottom: 8px;
    font-size: 15px;
  }
  .step {
    color: #444;
    font-size: 14px;
    line-height: 1.9;
    font-weight: 500;
  }
  .footer {
    margin-top: 18px;
    color: #888;
    font-size: 12px;
    line-height: 1.6;
  }
  .related-link {
    margin-top: 22px;
    font-size: 14px;
  }
  .related-link a {
    color: #06C755;
    font-weight: 700;
    text-decoration: none;
  }

  @media (min-width: 600px) {
    body { padding: 40px 20px; }
    .container { padding: 56px 64px; max-width: 720px; }
    .header-emoji { font-size: 56px; }
    h1 { font-size: 44px; }
    .store-name { font-size: 22px; }
    .subtitle { font-size: 20px; margin: 24px 0 32px; }
    .qr-wrapper { padding: 24px; border-width: 8px; }
    .qr-wrapper img { width: 400px; height: 400px; }
    .url-pill { font-size: 20px; padding: 14px 32px; }
    .instructions { padding: 24px 32px; margin-top: 28px; }
    .instructions-title { font-size: 18px; }
    .step { font-size: 17px; line-height: 2; }
    .footer { font-size: 14px; margin-top: 24px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header-emoji">🍙🍗</div>
  <h1>ビオ ご予約サイト</h1>
  <div class="store-name">いなりとチキン ビオ</div>
  <p class="subtitle">スマホで読み取って、24時間いつでも予約OK！</p>

  <div class="qr-wrapper">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=8&data=https%3A%2F%2Fmy-hp-xi.vercel.app%2F" alt="ビオ予約サイト QRコード">
  </div>

  <div>
    <div class="url-pill">my-hp-xi.vercel.app</div>
  </div>

  <a href="https://my-hp-xi.vercel.app/" class="lp-direct-btn">📲 直接予約サイトを開く</a>

  <div class="instructions">
    <div class="instructions-title">📲 PC画面のQRを読み取る場合</div>
    <div class="step">① スマホのカメラを起動</div>
    <div class="step">② QRコードに向ける</div>
    <div class="step">③ 画面に出るリンクをタップ</div>
    <div class="step">④ 予約フォームから注文！🎉</div>
  </div>

  <div class="related-link">
    💚 <a href="/qr.html">ビオ公式LINE 友だち追加 QR はこちら →</a>
  </div>

  <div class="footer">
    沖縄県南城市大里字仲間1141<br>
    ☎ 098-944-4191
  </div>
</div>
</body>
</html>
